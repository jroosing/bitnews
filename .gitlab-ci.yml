image: golang:1.27.2

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOFLAGS: -mod=readonly

cache:
  key:
    files: [go.sum]
  paths: [.go/pkg/mod, .cache/go-build]

stages: [lint, test, build]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: lint
  script:
    - make lint
    - make vuln

test:
  stage: test
  script:
    - make test
    - make fuzz-smoke FUZZTIME=10s

build:
  stage: build
  script:
    - make build-all
    - for f in dist/*; do go version -m "$f" | grep -q 'CGO_ENABLED=0' || { echo "$f not static"; exit 1; }; done
  artifacts:
    paths: [dist/]
    expire_in: 1 week
