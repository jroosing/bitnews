image: golang:1.27.3

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOFLAGS: -mod=readonly

cache:
  key:
    files: [go.sum]
  paths: [.go/pkg/mod, .cache/go-build, bin/tools]

stages: [lint, test, build, image]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: lint
  script:
    - make lint
    - make vuln

test:
  stage: test
  before_script:
    # make test fetches the pinned 7-Zip and par2 (scripts/get-postproc-tools.sh),
    # which needs xz and unzip; the Go image has neither.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends xz-utils unzip
  script:
    - make test

build:
  stage: build
  script:
    - make build-all
    - for f in dist/*; do go version -m "$f" | grep -q 'CGO_ENABLED=0' || { echo "$f not static"; exit 1; }; done
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# Multi-arch image for the GitLab container registry, tagged with the version
# (the tag, or the short commit on the default branch) and `latest`. It only
# runs for the default branch and for tags, never for merge requests. The Dockerfile
# cross-compiles on the build host, so no QEMU emulation is needed.
docker-image:
  stage: image
  # Registry timeouts on shared runners are usually gone on a second try.
  retry:
    max: 2
    when: script_failure
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # buildx refuses to build a builder straight from the dind TLS environment
    # (DOCKER_HOST and DOCKER_TLS_VERIFY): give it a context made from it.
    - docker context create ci-context
    # The builder boots a moby/buildkit container. Docker Hub often times out
    # on shared runners, so pull it with retries (and from Google's mirror as a
    # fallback) before buildx needs it.
    - |
      pull() { for i in 1 2 3 4; do docker pull "$1" && return 0; sleep $((i * 5)); done; return 1; }
      pull moby/buildkit:buildx-stable-1 || {
        pull mirror.gcr.io/moby/buildkit:buildx-stable-1 &&
        docker tag mirror.gcr.io/moby/buildkit:buildx-stable-1 moby/buildkit:buildx-stable-1
      }
    - docker buildx create --name ci-builder --driver docker-container --use ci-context
  script:
    - |
      version="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      tags="-t $CI_REGISTRY_IMAGE:$version -t $CI_REGISTRY_IMAGE:latest"
      docker buildx build --platform linux/amd64,linux/arm64 \
        --build-arg VERSION="$version" --build-arg COMMIT="$CI_COMMIT_SHORT_SHA" \
        $tags --push .
