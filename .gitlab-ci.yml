image: golang:1.27.3

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOFLAGS: -mod=readonly

cache:
  key:
    files: [go.sum]
  paths: [.go/pkg/mod, .cache/go-build]

stages: [lint, test, build, image]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: lint
  script:
    - make lint
    - make vuln

test:
  stage: test
  script:
    - make test
    - make fuzz-smoke FUZZTIME=10s

build:
  stage: build
  script:
    - make build-all
    - for f in dist/*; do go version -m "$f" | grep -q 'CGO_ENABLED=0' || { echo "$f not static"; exit 1; }; done
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# Multi-arch image for the GitLab container registry, tagged with the version
# (the tag, or the short commit on the default branch) and `latest`. It only
# runs for the default branch and for tags, never for merge requests. The Dockerfile
# cross-compiles on the build host, so no QEMU emulation is needed.
docker-image:
  stage: image
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use
  script:
    - |
      version="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      tags="-t $CI_REGISTRY_IMAGE:$version -t $CI_REGISTRY_IMAGE:latest"
      docker buildx build --platform linux/amd64,linux/arm64 \
        --build-arg VERSION="$version" --build-arg COMMIT="$CI_COMMIT_SHORT_SHA" \
        $tags --push .
