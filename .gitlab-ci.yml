image: golang:1.27.3

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOFLAGS: -mod=readonly

cache:
  key:
    files: [go.sum]
  paths: [.go/pkg/mod, .cache/go-build, bin/tools]

stages: [lint, test, build, image]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: lint
  script:
    - make lint
    - make vuln

test:
  stage: test
  before_script:
    # make test fetches the pinned 7-Zip and par2 (scripts/get-postproc-tools.sh),
    # which needs xz and unzip; the Go image has neither.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends xz-utils unzip
  script:
    - make test

build:
  stage: build
  script:
    - make build-all
    - for f in dist/*; do go version -m "$f" | grep -q 'CGO_ENABLED=0' || { echo "$f not static"; exit 1; }; done
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# Image for the GitLab container registry (linux/amd64, the runner's own
# architecture), tagged with the version (the tag, or the short commit on the
# default branch) and `latest`. It only runs for the default branch and for
# tags, never for merge requests. For arm64, build the Dockerfile with
# `docker buildx build --platform linux/arm64` (docs/deploy.md).
docker-image:
  stage: image
  # Registry timeouts on shared runners are usually gone on a second try.
  retry:
    max: 2
    when: script_failure
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      version="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      docker build --build-arg VERSION="$version" --build-arg COMMIT="$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE:$version" -t "$CI_REGISTRY_IMAGE:latest" .
      docker push "$CI_REGISTRY_IMAGE:$version"
      docker push "$CI_REGISTRY_IMAGE:latest"
