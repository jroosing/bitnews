{{/*
  toast_region: the aria-live region the toast store (app.js) renders into.
  Trigger a toast from the server with the response header
    HX-Trigger: {"toast":{"level":"success","message":"Saved"}}
  Levels: success, info, warn, danger.
*/}}
{{define "toast_region"}}
<div x-data="toastRegion" class="pointer-events-none fixed inset-x-0 bottom-0 z-[60] flex flex-col items-end gap-3 p-4 sm:p-6" aria-live="polite" aria-atomic="false">
  <template x-for="t in items" :key="t.id">
    <div class="toast max-w-sm" :role="t.role">
      <span class="toast-icon text-ok-fg" x-show="t.isSuccess">{{icon "check-circle" "size-5"}}</span>
      <span class="toast-icon text-info-fg" x-show="t.isInfo">{{icon "info" "size-5"}}</span>
      <span class="toast-icon text-warn-fg" x-show="t.isWarn">{{icon "warning" "size-5"}}</span>
      <span class="toast-icon text-bad-fg" x-show="t.isDanger">{{icon "error" "size-5"}}</span>
      <p class="min-w-0 flex-1 break-words text-fg" x-text="t.message"></p>
      <button type="button" class="-m-1 rounded-md p-1 text-fg-subtle hover:text-fg" :data-id="t.id" @click="dismiss" aria-label="Dismiss notification">{{icon "close" "size-4"}}</button>
    </div>
  </template>
</div>
{{end}}
