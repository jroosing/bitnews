{{/*
  empty_state: Keys: Icon, Title, Body, ActionLabel, ActionHref (optional).
*/}}
{{define "empty_state"}}
<div class="flex flex-col items-center px-6 py-12 text-center">
  <span class="flex size-12 items-center justify-center rounded-full bg-surface-2 text-fg-subtle">{{icon (or .Icon "inbox") "size-6"}}</span>
  <h3 class="mt-4 text-base">{{.Title}}</h3>
  {{- with .Body}}<p class="mt-1 max-w-sm text-sm text-fg-muted">{{.}}</p>{{end}}
  {{- if and .ActionLabel .ActionHref}}<a href="{{.ActionHref}}" class="btn btn-secondary mt-5">{{.ActionLabel}}</a>{{end}}
</div>
{{end}}
