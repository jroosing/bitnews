{{define "content"}}
<div class="card shadow-pop">
  <div class="card-body p-6 text-center sm:p-8">
    <p class="text-5xl font-semibold tracking-tight text-fg-subtle tabular-nums">{{.Page.Status}}</p>
    <h1 class="mt-3 text-xl">{{.Page.Heading}}</h1>
    <p class="mt-2 text-sm text-fg-muted">{{.Page.Message}}</p>
    <div class="mt-6 flex justify-center gap-2">
      <a href="{{.Page.Href}}" class="btn btn-primary">{{.Page.HrefLabel}}</a>
    </div>
  </div>
</div>
{{end}}
