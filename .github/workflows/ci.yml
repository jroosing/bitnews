name: ci

# Only a release (a tag push) runs CI, to save Actions minutes. Run
# `make check` locally before pushing to main.
on:
  push:
    tags: ['*']

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make vuln

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # make test fetches the pinned 7-Zip and par2 (scripts/get-postproc-tools.sh),
      # which needs xz and unzip.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xz-utils unzip
      - run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build-all
      - name: Check binaries are static
        run: |
          for f in dist/*; do
            go version -m "$f" | grep -q 'CGO_ENABLED=0' || { echo "$f not static"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Image for ghcr.io, linux/amd64 only, tagged `latest` and the tag name
  # (no commit-hash tag), once lint, test and build passed.
  docker-image:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          short="$(git rev-parse --short HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/amd64 \
            --build-arg VERSION="$GITHUB_REF_NAME" --build-arg COMMIT="$short" \
            -t "$image:latest" -t "$image:$GITHUB_REF_NAME" --push .
