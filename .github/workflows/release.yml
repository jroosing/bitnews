name: release

# A tag push publishes a GitHub release with the linux/amd64 tarball (binary
# plus the pinned 7zz and par2). The Proxmox LXC scripts install from it.
# ci.yml also runs on the tag and publishes the Docker image.

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xz-utils unzip
      - run: scripts/package-release.sh "$GITHUB_REF_NAME" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --title "$GITHUB_REF_NAME" --generate-notes
